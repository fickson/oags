spec_version: "0.1"

project:
  name: support-pro-v2
  version: "1.0.4"
  description: "Handles billing and ticket inquiries"

identity:
  model: gpt-4o
  system_prompt_path: ./system_prompt.md
  tools_path: ./tools.json

permissions:
  network:
    enabled: true
    require_tls: true
    allowed_domains:
      - "api.stripe.com"
      - "help-desk.zendesk.com"
    blocked_domains:
      - "*"
  filesystem:
    enabled: true
    allowed_paths:
      - "./kb_docs"
      - "./logs/agent.log"
    blocked_paths:
      - "*"

tools:
  allowed_tools:
    - name: "zendesk:read_ticket"
    - name: "stripe:list_subscriptions"
  blocked_tools:
    - "shell_exec"
    - "eval"

rate_limits:
  per_agent:
    tokens_per_minute: 2000

custom_rules:
  - id: refund-approval
    name: "Require approval for refunds"
    enabled: true
    scope:
      capabilities: ["stripe:issue_refund"]
    conditions:
      - field: "amount"
        operator: greater_than
        value: 50.00
    logic: any
    action: deny
    message: "Refunds over $50 require human approval"
  - id: tool-call-limit
    name: "Limit tool calls per turn"
    enabled: true
    scope:
      capabilities: ["*"]
    conditions:
      - field: "tool_calls_this_turn"
        operator: greater_than
        value: 3
    logic: any
    action: deny
    message: "Maximum 3 tool calls per turn"

compliance:
  sensitive_data_detection: true
  audit_logging: true

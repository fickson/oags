spec_version: "0.1"

project:
  name: multi-provider-agent
  version: "1.0.0"
  description: "Demonstrates LLM provider configuration variants"

identity:
  model: gpt-4o
  system_prompt_path: ./system_prompt.md
  tools_path: ./tools.json

permissions:
  network:
    enabled: true
    require_tls: true

tools:
  blocked_tools:
    - "shell_exec"
    - "eval"

models:
  allowed_models:
    - "gpt-4o"
    - "claude-sonnet-4-5-20250929"
    - "gemini-2.0-flash"

# --- Provider examples ---
# Uncomment the llm block matching your provider.

# OpenAI (default)
llm:
  provider: openai
  model: gpt-4o
  api_key_env: OPENAI_API_KEY
  temperature: 0.7
  max_tokens: 2048
  streaming: true

# Anthropic
# llm:
#   provider: anthropic
#   model: claude-sonnet-4-5-20250929
#   api_key_env: ANTHROPIC_API_KEY
#   temperature: 0.7
#   max_tokens: 4096
#   streaming: true

# Google (Gemini)
# llm:
#   provider: google
#   model: gemini-2.0-flash
#   api_key_env: GOOGLE_API_KEY
#   temperature: 0.7
#   max_tokens: 2048

# Ollama (local, self-hosted)
# llm:
#   provider: ollama
#   model: llama3.1:70b
#   api_key_env: ""
#   base_url: http://localhost:11434
#   temperature: 0.7

# Custom / OpenAI-compatible proxy
# llm:
#   provider: custom
#   model: my-fine-tune-v3
#   api_key_env: CUSTOM_API_KEY
#   base_url: https://llm-proxy.internal.example.com/v1
#   temperature: 0.5
#   max_tokens: 2048
